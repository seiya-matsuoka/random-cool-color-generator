name: CI

on:
  # PR は品質確認だけを行う。main push は、検証成功後に同じ実行の成果物を公開する。
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  # 通常の品質確認には読み取りだけを許可し、公開用の権限は deploy に限定する。
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 設定ファイルの評価前から、Storybook の起動イベントも無効にする。
      STORYBOOK_DISABLE_TELEMETRY: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      # ブラウザは workspace 内へ取得する。Ubuntu の共有ライブラリ・フォントは使い捨て runner に導入する。
      # キャッシュの復元と OS 依存導入を混同しないため、browser cache は追加しない。
      - name: Install Chromium and system dependencies
        run: npm run e2e:install -- --with-deps
      # 本番 E2E と開発 Strict Mode の補助検証も、ローカルと同じ集約コマンドで実行する。
      - name: Verify
        run: npm run verify
      # 失敗した最初の試行の trace を残す。実データ・認証済み profile・環境変数一覧は含めない。
      - name: Upload browser failure reports
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      # verify で本番 E2E が使用した dist を、そのまま Pages 用に梱包する。
      # 失敗・キャンセル時や PR では保存しない。Storybook・テストレポートは公開物に含めない。
      - name: Upload GitHub Pages artifact
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: dist
          retention-days: 1
          include-hidden-files: false

  deploy:
    # job ごとの runner は別環境になる。needs により、検証と artifact 保存の成功を待つ。
    # PR には公開経路を与えず、失敗した verify を always() などで迂回しない。
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # 公開直前に main の現在のコミットを読み取る。
      pages: write # Pages に artifact の公開を要求する。
      id-token: write # 実行元のブランチなどを証明する OIDC トークンを取得する。
    # environment は公開先と保護ルールを管理する。Source と main 制限はユーザーが事前設定する。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 公開だけを直列化し、進行中の公開を新しい push で中断しない。
    # 待機枠も複数にし、遅れて到着した古い実行が新しい待機中の実行を押し出すことを防ぐ。
    # 待機順とコミット順は一致するとは限らないため、開始後の main 照合も必要になる。
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    steps:
      # hosted Ubuntu に導入済みの gh を使う。取得失敗や不正な応答は失敗にし、公開を進めない。
      # token はこの step の環境変数だけで渡し、値をログや実行サマリーへ出さない。
      - name: Check current main commit
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current_sha="$(gh api --method GET "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not read a valid main commit SHA.'
            exit 1
          fi

          # GITHUB_OUTPUT は後続 step に渡す値。古い実行の再実行による巻き戻しも防ぐ。
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'is_latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_latest=false' >> "$GITHUB_OUTPUT"
            # GITHUB_STEP_SUMMARY は Actions の実行画面に表示する説明であり、公開ページではない。
            {
              printf '### GitHub Pages deployment skipped\n\n'
              printf 'Run commit: `%s`\n\nCurrent main: `%s`\n' "$GITHUB_SHA" "$current_sha"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Pages はユーザーが GitHub Actions source に設定する。自動有効化や生成ツールの設定変更は行わない。
      - name: Check GitHub Pages configuration
        if: ${{ steps.latest.outputs.is_latest == 'true' }}
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      # 同じ workflow 実行で保存した artifact を直接使う。checkout・依存導入・再 build は不要。
      - name: Deploy to GitHub Pages
        if: ${{ steps.latest.outputs.is_latest == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
      # 公開に成功した URL は environment と実行サマリーの両方から確認できるようにする。
      - name: Show GitHub Pages URL
        if: ${{ steps.latest.outputs.is_latest == 'true' }}
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            printf '### GitHub Pages\n\n'
            printf 'URL: %s\n\nCommit: `%s`\n' "$PAGE_URL" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
