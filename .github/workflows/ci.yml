name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      # 実機能のテストがないフェーズ 1 は、静的検査とアプリ build を実行する。
      - name: Verify
        run: npm run verify
