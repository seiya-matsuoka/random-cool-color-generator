name: CI

on:
  # PR は品質確認だけを行う。main push は、検証成功後に同じ実行の成果物を公開する。
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  # 通常の品質確認には読み取りだけを許可し、公開用の権限は deploy に限定する。
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 設定ファイルの評価前から、Storybook の起動イベントも無効にする。
      STORYBOOK_DISABLE_TELEMETRY: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      # ブラウザは workspace 内へ取得する。Ubuntu の共有ライブラリ・フォントは使い捨て runner に導入する。
      # キャッシュの復元と OS 依存導入を混同しないため、browser cache は追加しない。
      - name: Install Chromium and system dependencies
        run: npm run e2e:install -- --with-deps
      # 本番 E2E と開発 Strict Mode の補助検証も、ローカルと同じ集約コマンドで実行する。
      - name: Verify
        run: npm run verify
      # 失敗した最初の試行の trace を残す。実データ・認証済み profile・環境変数一覧は含めない。
      - name: Upload browser failure reports
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      # verify で本番 E2E が使用した dist を、そのまま Pages 用に梱包する。
      # 失敗・キャンセル時や PR では保存しない。Storybook・テストレポートは公開物に含めない。
      - name: Upload GitHub Pages artifact
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: dist
          retention-days: 1
          include-hidden-files: false
