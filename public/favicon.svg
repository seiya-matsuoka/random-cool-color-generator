<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="icon-title"
>
  <title id="icon-title">Random Cool Color Generator</title>
  <!-- 小さなタブでも区別できるよう、文字や細線を使わず寒色の色面を重ねる。 -->
  <rect x="6" y="6" width="28" height="28" rx="7" fill="#22D3EE" />
  <rect x="18" y="18" width="28" height="28" rx="7" fill="#1D89E2" />
  <rect x="30" y="30" width="28" height="28" rx="7" fill="#7C3AED" />
</svg>
